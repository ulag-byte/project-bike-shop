<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Bike Search</title>
</head>
<body>
    <div class="container">
        <h1>Bike Search</h1>
        <div class="filters">
            <input type="text" id="search-bar" placeholder="Search by name or category...">
            <div class="filter-group">
                <label for="min-price">Min Price:</label>
                <input type="number" id="min-price" placeholder="0" min="0" step="100">
            </div>
            <div class="filter-group">
                <label for="max-price">Max Price:</label>
                <input type="number" id="max-price" placeholder="5000" min="0" step="100">
            </div>
            <div class="filter-group">
                <label for="category">Category:</label>
                <select id="category">
                    <option value="">All Categories</option>
                    <option value="Road Series">Road Series</option>
                    <option value="Mountain Series">Mountain Series</option>
                    <option value="Street Series">Street Series</option>
                    <option value="Hybrid">Hybrid</option>
                    <option value="Electric">Electric</option>
                    <option value="Gravel">Gravel</option>
                    <option value="BMX">BMX</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="wheel-size">Wheel Size:</label>
                <select id="wheel-size">
                    <option value="">All Sizes</option>
                    <option value="26 inches">26 inches</option>
                    <option value="27.5 inches">27.5 inches</option>
                    <option value="29 inches">29 inches</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="availability">Availability:</label>
                <select id="availability">
                    <option value="">All</option>
                    <option value="true">Available</option>
                    <option value="false">Not Available</option>
                </select>
            </div>
        </div>
        <div id="bike-list" class="bike-list"></div>
    </div>
    
    <script src="bikes.js"></script>
</body>
</html>
